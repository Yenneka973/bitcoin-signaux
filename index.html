<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signaux Bitcoin</title>
<style>
:root {
  --bg: #eef1f4; --card: #ffffff; --ink: #1b2430; --muted: #5d6b7a;
  --up: #1d7a4b; --down: #b3342b; --line: #d5dbe2;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151b23; --card: #1e2630; --ink: #e8edf2; --muted: #9aa8b6; --up: #4cc38a; --down: #ff7b72; --line: #2d3946; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; }
h1 { font-size: 1.4rem; margin: 0 0 16px; font-weight: 700; }
.prix, .graphique { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
.devise { color: var(--muted); font-size: 0.95rem; }
.montant { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
.var { font-size: 0.95rem; font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); }
.choix { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.defile { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
.choix button { font: inherit; font-size: 0.9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; flex-shrink: 0; }
.choix button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.prix-courbe { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
svg { display: block; width: 100%; height: auto; }
.bornes { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; margin-top: 6px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; min-height: 1.2em; }
#maj { color: var(--muted); font-size: 0.85rem; margin: 12px 0; min-height: 1.3em; }
.avert { border-left: 4px solid var(--down); padding: 8px 12px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Bitcoin en direct</h1>

  <section class="prix">
    <div class="devise">Prix en euros</div>
    <div class="montant" id="eur">…</div>
    <div class="var" id="eur-var"></div>
  </section>

  <section class="prix">
    <div class="devise">Prix en dollars</div>
    <div class="montant" id="usd">…</div>
    <div class="var" id="usd-var"></div>
  </section>

  <section class="graphique">
    <div class="choix" id="choix-devise"></div>
    <div class="choix defile" id="choix-periode"></div>
    <div class="prix-courbe" id="prix-courbe"></div>
    <svg id="courbe" viewBox="0 0 300 140" role="img" aria-label="Graphique du prix du Bitcoin"></svg>
    <div class="bornes"><span id="bas"></span><span id="haut"></span></div>
    <div class="bornes"><span id="debut"></span><span id="fin"></span></div>
    <p class="note" id="note"></p>
  </section>

  <p id="maj">Chargement du prix…</p>

  <p class="avert">Ces informations ne sont pas des conseils financiers. Le Bitcoin est très volatil et vous pouvez perdre de l’argent.</p>
</main>

<script>
// Sources gratuites : API publique de Binance (prix) et Frankfurter (taux de change, si besoin)
const BASE = "https://api.binance.com/api/v3/";

async function lirePrix(paire) {
  const r = await fetch(BASE + "ticker/24hr?symbol=" + paire);
  if (!r.ok) throw new Error("Erreur " + r.status);
  const d = await r.json();
  return { prix: parseFloat(d.lastPrice), variation: parseFloat(d.priceChangePercent) };
}

function formater(v, devise) {
  return v.toLocaleString("fr-FR", { style: "currency", currency: devise, maximumFractionDigits: 0 });
}

function afficher(idMontant, idVar, donnees, devise) {
  document.getElementById(idMontant).textContent = formater(donnees.prix, devise);
  const v = document.getElementById(idVar);
  const signe = donnees.variation >= 0 ? "+" : "";
  v.textContent = signe + donnees.variation.toFixed(2).replace(".", ",") + " % sur 24 h";
  v.className = "var " + (donnees.variation >= 0 ? "up" : "down");
}

async function actualiser() {
  const maj = document.getElementById("maj");
  try {
    const [eur, usd] = await Promise.all([lirePrix("BTCEUR"), lirePrix("BTCUSDT")]);
    afficher("eur", "eur-var", eur, "EUR");
    afficher("usd", "usd-var", usd, "USD");
    maj.textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR");
  } catch (e) {
    maj.textContent = "Impossible de récupérer le prix. Vérifiez votre connexion ; nouvel essai dans 10 secondes.";
  }
}

// ----- Graphique -----
// Paire Binance pour chaque devise ; si elle n'existe pas, on convertit depuis le dollar.
const DEVISES = {
  EUR: { pair: "BTCEUR", sym: "€" },
  USD: { pair: "BTCUSDT", sym: "$" },
  GBP: { pair: "BTCGBP", sym: "£" },
  JPY: { pair: "BTCJPY", sym: "¥" },
  CAD: { pair: "BTCCAD", sym: "C$" },
  AUD: { pair: "BTCAUD", sym: "A$" }
};

// Périodes : durée en heures. Jusqu'à 48 h on utilise des bougies de 15 min, au-delà d'1 heure.
const PERIODES = {};
[24, 36, 48, 60, 72, 84, 96, 108, 120, 132, 144].forEach(h => { PERIODES[h + " h"] = h; });
PERIODES["7 j"] = 168; PERIODES["2 sem."] = 336; PERIODES["3 sem."] = 504; PERIODES["30 j"] = 720;

let devise = "EUR", periode = "24 h";

function boutons(idConteneur, noms, actuel, libelle, quandChoisi) {
  const c = document.getElementById(idConteneur);
  c.innerHTML = "";
  noms.forEach(nom => {
    const b = document.createElement("button");
    b.textContent = libelle(nom);
    b.setAttribute("aria-pressed", nom === actuel);
    b.onclick = () => quandChoisi(nom);
    c.appendChild(b);
  });
}

function menus() {
  boutons("choix-devise", Object.keys(DEVISES), devise, n => DEVISES[n].sym, n => { devise = n; menus(); dessiner(); });
  boutons("choix-periode", Object.keys(PERIODES), periode, n => n, n => { periode = n; menus(); dessiner(); });
}

async function bougies(paire, heures) {
  const court = heures <= 48;
  const url = BASE + "klines?symbol=" + paire + "&interval=" + (court ? "15m" : "1h") + "&limit=" + (court ? heures * 4 : heures);
  const r = await fetch(url);
  if (!r.ok) throw new Error("Erreur " + r.status);
  return (await r.json()).map(b => ({ t: b[0], c: parseFloat(b[4]) }));
}

async function serie(dev, heures) {
  try {
    return { points: await bougies(DEVISES[dev].pair, heures), converti: false };
  } catch (e) {
    // Paire absente : on convertit le prix en dollars avec le taux de change du jour
    const [pts, taux] = await Promise.all([
      bougies("BTCUSDT", heures),
      fetch("https://api.frankfurter.app/latest?from=USD&to=" + dev).then(r => r.json())
    ]);
    const t = taux.rates[dev];
    return { points: pts.map(p => ({ t: p.t, c: p.c * t })), converti: true };
  }
}

async function dessiner() {
  const svg = document.getElementById("courbe");
  const choix = devise + "|" + periode;
  try {
    const res = await serie(devise, PERIODES[periode]);
    if (choix !== devise + "|" + periode) return; // l'utilisateur a changé entre-temps
    const pts = res.points, prix = pts.map(p => p.c);
    const min = Math.min(...prix), max = Math.max(...prix);
    const W = 300, H = 140, marge = 6;
    const chemin = prix.map((v, i) => {
      const x = (i / (prix.length - 1)) * W;
      const y = marge + (H - 2 * marge) * (1 - (v - min) / (max - min || 1));
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    const monte = prix[prix.length - 1] >= prix[0];
    const couleur = getComputedStyle(document.documentElement).getPropertyValue(monte ? "--up" : "--down");
    svg.innerHTML = '<polyline points="' + chemin + '" fill="none" stroke="' + couleur + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    document.getElementById("prix-courbe").textContent = formater(prix[prix.length - 1], devise);
    document.getElementById("bas").textContent = "Plus bas : " + formater(min, devise);
    document.getElementById("haut").textContent = "Plus haut : " + formater(max, devise);
    const fmtDate = t => new Date(t).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    document.getElementById("debut").textContent = fmtDate(pts[0].t);
    document.getElementById("fin").textContent = fmtDate(pts[pts.length - 1].t);
    document.getElementById("note").textContent = res.converti ? "Prix converti depuis le dollar au taux de change du jour : valeur approximative." : "";
  } catch (e) {
    svg.innerHTML = '<text x="10" y="70" fill="currentColor" font-size="12">Graphique indisponible pour le moment.</text>';
  }
}

menus();
actualiser();
dessiner();
setInterval(actualiser, 10000);
setInterval(dessiner, 60000);
</script>
</body>
</html>
